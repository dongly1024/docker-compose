services:
  elasticsearch:
    image: elasticsearch:8.3.3
    container_name: elasticsearch8
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - TZ=Asia/Shanghai
      - discovery.type=single-node
#      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=123456 # 设置 elastic 用户密码（生产环境建议修改）
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - ~/docker/elasticsearch/data:/usr/share/elasticsearch/data
    networks:
      - my-network
  kibana:
    image: kibana:8.3.3
    container_name: kibana8
    environment:
      - TZ=Asia/Shanghai  # 指向 Elasticsearch 服务
      - "I18N_LOCALE=zh-CN"
#      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200  # 指向 Elasticsearch 服务
#      - "ELASTICSEARCH_USERNAME=elastic"  # 默认用户名
#      - "ELASTICSEARCH_PASSWORD=123456"  # 与上面设置的密码一致
    ports:
      - "5601:5601"  # Kibana Web 端口
    depends_on:
      - elasticsearch  # 依赖 Elasticsearch 启动完成
    networks:
      - my-network
networks:
  my-network:
    driver: bridge
    name: my-network
    external: true